# Production compose for the LightFlux API.
#
# This runs ONLY the Node API. PostgreSQL is hosted on Supabase and reached
# through DATABASE_URL, so no database container is defined here. The API binds
# to localhost; nginx terminates TLS and reverse-proxies to it.
#
# Archived recovery build uses server/ and shared/ from the repository root.
services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - ../server/.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - lightflux-uploads:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lightflux-uploads:
